<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f4f6fa; }
  #map { width: 100%; height: 480px; }
  #toolbar {
    display: flex; gap: 8px; padding: 8px 10px;
    background: #0f2342; align-items: center; flex-wrap: wrap;
  }
  #toolbar span { color: #c9d6ea; font-size: 12px; font-weight: 600; }
  button {
    padding: 5px 12px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 600;
  }
  #btn-poly { background: #f2b705; color: #1b2a4a; }
  #btn-rect { background: #27497e; color: #fff; }
  #btn-clear { background: #c0392b; color: #fff; }
  #btn-done { background: #2e8b57; color: #fff; margin-left: auto; font-size: 13px; padding: 6px 18px; }
  #btn-done:disabled { background: #aaa; cursor: not-allowed; }
  #status { color: #f2b705; font-size: 11px; padding: 4px 10px; background: #1e3a66; }
  .leaflet-div-icon {
    width: 8px !important; height: 8px !important;
    margin-left: -4px !important; margin-top: -4px !important;
    background: #f2b705; border: 1.5px solid #333; border-radius: 2px;
  }
</style>
</head>
<body>
<div id="toolbar">
  <span>그리기:</span>
  <button id="btn-poly">⬠ 다각형</button>
  <button id="btn-rect">▭ 사각형</button>
  <button id="btn-clear">✕ 지우기</button>
  <button id="btn-done" disabled>✅ 완료 — 이 도형 사용</button>
</div>
<div id="status">위치를 이동·확대한 뒤 도구를 선택해 그리세요. 다각형: 더블클릭으로 완성.</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
// Streamlit 컴포넌트 통신
function sendToStreamlit(data) {
  window.parent.postMessage({ type: "streamlit:setComponentValue", value: data }, "*");
}

// 초기 파라미터 수신
var params = {};
window.addEventListener("message", function(e) {
  if (e.data.type === "streamlit:render") {
    params = e.data.args || {};
    initMap(params);
  }
});

// Streamlit에 높이 알림
function setHeight(h) {
  window.parent.postMessage({ type: "streamlit:setFrameHeight", height: h }, "*");
}
setHeight(530);

var map, drawnItems, drawHandler;
var vworldKey = "";

function initMap(p) {
  if (map) { map.remove(); }
  vworldKey = p.vworld_key || "";
  var center = p.center || [35.18, 128.1076];
  var zoom = p.zoom || 16;

  map = L.map("map", { center: center, zoom: zoom, zoomControl: true });

  // 기본 타일
  var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "OSM", maxZoom: 22, maxNativeZoom: 19
  });
  var esri = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { attribution: "Esri", maxZoom: 22, maxNativeZoom: 19 }
  );
  esri.addTo(map);

  var layers = { "일반지도": osm, "위성사진": esri };

  // V-World 지적도
  if (vworldKey) {
    var vwBase = L.tileLayer(
      "https://api.vworld.kr/req/wmts/1.0.0/" + vworldKey + "/Base/{z}/{y}/{x}.png",
      { attribution: "브이월드", maxZoom: 22, maxNativeZoom: 22 }
    );
    var cadastre = L.tileLayer.wms("https://api.vworld.kr/req/wms?key=" + vworldKey + "&", {
      layers: "lt_c_landinfobasemap",
      format: "image/png",
      transparent: true,
      version: "1.3.0",
      maxZoom: 22,
      maxNativeZoom: 22,
    });
    layers["브이월드"] = vwBase;
    layers["🗺️ 지적도"] = cadastre;
    cadastre.addTo(map);
  }

  L.control.layers(layers, {}, { position: "topright" }).addTo(map);
  L.control.scale({ imperial: false }).addTo(map);

  drawnItems = new L.FeatureGroup();
  map.addLayer(drawnItems);

  // 그리기 완료 이벤트
  map.on(L.Draw.Event.CREATED, function(e) {
    drawnItems.clearLayers();
    drawnItems.addLayer(e.layer);
    document.getElementById("btn-done").disabled = false;
    document.getElementById("status").textContent = "✅ 도형 완성! '완료' 버튼을 눌러 저장하세요.";
    if (drawHandler) { drawHandler.disable(); drawHandler = null; }
  });
}

// 다각형 버튼
document.getElementById("btn-poly").onclick = function() {
  if (!map) return;
  if (drawHandler) drawHandler.disable();
  drawHandler = new L.Draw.Polygon(map, {
    allowIntersection: false,
    showArea: false,
    shapeOptions: { color: "#f2b705", weight: 2, fillOpacity: 0.2 },
    icon: new L.DivIcon({ iconSize: [8,8], iconAnchor: [4,4], className: "leaflet-div-icon" }),
    touchIcon: new L.DivIcon({ iconSize: [10,10], iconAnchor: [5,5], className: "leaflet-div-icon" }),
  });
  drawHandler.enable();
  document.getElementById("status").textContent = "⬠ 꼭짓점을 찍으세요. 더블클릭으로 완성.";
};

// 사각형 버튼
document.getElementById("btn-rect").onclick = function() {
  if (!map) return;
  if (drawHandler) drawHandler.disable();
  drawHandler = new L.Draw.Rectangle(map, {
    shapeOptions: { color: "#f2b705", weight: 2, fillOpacity: 0.2 },
  });
  drawHandler.enable();
  document.getElementById("status").textContent = "▭ 드래그해서 사각형을 그리세요.";
};

// 지우기
document.getElementById("btn-clear").onclick = function() {
  if (drawnItems) drawnItems.clearLayers();
  document.getElementById("btn-done").disabled = true;
  document.getElementById("status").textContent = "지워졌습니다. 다시 그리세요.";
};

// 완료 버튼 — 이때만 Streamlit에 데이터 전송
document.getElementById("btn-done").onclick = function() {
  var geojson = drawnItems.toGeoJSON();
  if (!geojson.features || geojson.features.length === 0) return;
  var feat = geojson.features[0];
  var center = map.getCenter();
  sendToStreamlit({
    geojson: feat,
    map_center: [center.lat, center.lng],
    map_zoom: map.getZoom(),
  });
  document.getElementById("status").textContent = "저장 완료 ✅";
};
</script>
</body>
</html>
